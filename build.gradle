buildscript {
    ext {
        appVersion = "1.0.0.0"
        springBootVersion = "3.4.3"
        kotlinVersion = "2.1.20"
        springDependencyManagement = "1.1.7"
    }

    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

repositories {
    mavenCentral()
    gradlePluginPortal()
}


allprojects {
    group 'org.bronco'
    version "$appVersion"
    project.buildDir = "target"
}

subprojects {
    repositories {
        mavenCentral()
    }

    dependencies {

    }
}
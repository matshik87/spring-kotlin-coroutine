spring:
  liquibase:
    change-log: classpath:/db/changelogs/changelog-master.xml
  kafka:
    bootstrap-servers: localhost:19092

payments:
  data-source:
    maxPoolSize: 10
    dialect: POSTGRES
  password:
    default: test-passwd-1234
    algorithm: SHA-512
    charset: UTF-8
  kafka:
    consumers:
      create-topics: false
      containers:
        default-container:
          concurrency: 1
      topics:
        create-customer:
          topic-name: payments.customer.create
          concurrency: ${payments.kafka.consumers.containers.default-container.concurrency}
          group-id: payments.customer-management
          auto-offset-reset: latest
          auto-commit: false
          bootstrap-servers: ${payments.kafka.bootstrap-servers}
          key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
          value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

containers:
  kafka:
    enabled: true
    image: apache/kafka:3.9.1
    destroy-on-exit: true
    properties:
      bootstrap-servers: payments.kafka.bootstrap-servers
  db:
    enabled: true
    image: postgres:16.8-alpine3.20
    user: payments-test-username
    password: payments-test-passwd
    name: payments
    destroy-on-exit: true
    properties:
      databaseName: payments.data-source.schema,spring.liquibase.liquibase-schema,spring.liquibase.default-schema
      databaseUrl: payments.data-source.jdbc-url
      username: payments.data-source.username
      password: payments.data-source.password
      init-script: db/init-schema.sql
server:
  port: 8080
  http2:
    enabled: true
  servlet:
    context-path: /api
spring:
  application:
    name: payment-service
  liquibase:
    change-log: classpath:/db/changelogs/changelog-master.xml
    liquibase-schema: ${DB_SCHEMA}
    default-schema: ${DB_SCHEMA}

management:
  server:
    port: 9000
    base-path: /app
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,metrics,prometheus,info
  info:
    env:
      enabled: true
    os:
      enabled: true
    build:
      enabled: true
springdoc:
  api-docs:
    enabled: true
    path: /swagger

payments:
  data-source:
    schema: ${DB_SCHEMA}
    jdbc-url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    maxPoolSize: 10
    pool-name: payments-service-pool
    dialect: POSTGRES